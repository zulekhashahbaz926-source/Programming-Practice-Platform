<svg width="100%" viewBox="0 0 680 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sequence Diagram - Code Submission Flow</title>
<desc>Sequence diagram showing the code submission process from User to GUI to Evaluator to Database</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text style="font:500 15px sans-serif;fill:#1E40AF" x="340" y="28" text-anchor="middle">Sequence Diagram — Code Submission Flow</text>

<!-- Lifeline headers -->
<rect x="30" y="42" width="90" height="34" rx="6" fill="#1E40AF"/>
<text style="font:500 12px sans-serif;fill:#fff" x="75" y="64" text-anchor="middle" dominant-baseline="central">User</text>

<rect x="178" y="42" width="100" height="34" rx="6" fill="#2563EB"/>
<text style="font:500 12px sans-serif;fill:#fff" x="228" y="64" text-anchor="middle" dominant-baseline="central">GUI</text>

<rect x="326" y="42" width="110" height="34" rx="6" fill="#7C3AED"/>
<text style="font:500 12px sans-serif;fill:#fff" x="381" y="64" text-anchor="middle" dominant-baseline="central">Evaluator</text>

<rect x="488" y="42" width="90" height="34" rx="6" fill="#059669"/>
<text style="font:500 12px sans-serif;fill:#fff" x="533" y="64" text-anchor="middle" dominant-baseline="central">Database</text>

<rect x="608" y="42" width="50" height="34" rx="6" fill="#D97706"/>
<text style="font:500 11px sans-serif;fill:#fff" x="633" y="64" text-anchor="middle" dominant-baseline="central">Auth</text>

<!-- Lifelines (dashed) -->
<line x1="75" y1="76" x2="75" y2="618" stroke="#1E40AF" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="228" y1="76" x2="228" y2="618" stroke="#2563EB" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="381" y1="76" x2="381" y2="618" stroke="#7C3AED" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="533" y1="76" x2="533" y2="618" stroke="#059669" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
<line x1="633" y1="76" x2="633" y2="618" stroke="#D97706" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>

<!-- Activation boxes -->
<rect x="69" y="120" width="12" height="420" rx="2" fill="#1E40AF" opacity="0.35"/>
<rect x="222" y="150" width="12" height="350" rx="2" fill="#2563EB" opacity="0.35"/>
<rect x="375" y="230" width="12" height="230" rx="2" fill="#7C3AED" opacity="0.35"/>
<rect x="527" y="290" width="12" height="160" rx="2" fill="#059669" opacity="0.35"/>
<rect x="627" y="110" width="12" height="60" rx="2" fill="#D97706" opacity="0.35"/>

<!-- Message arrows -->
<!-- 1. Login -->
<line x1="81" y1="120" x2="622" y2="120" stroke="#D97706" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="200" y="114">1. login(username, password)</text>

<line x1="627" y1="160" x2="82" y2="160" stroke="#D97706" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="200" y="154">2. auth_token</text>

<!-- 3. Open problem -->
<line x1="81" y1="195" x2="222" y2="195" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="130" y="189">3. open_problem(id)</text>

<line x1="228" y1="220" x2="527" y2="220" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="320" y="214">4. fetch_problem(id)</text>

<line x1="527" y1="250" x2="234" y2="250" stroke="#059669" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="320" y="244">5. problem data</text>

<line x1="222" y1="275" x2="82" y2="275" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="100" y="269">6. display editor</text>

<!-- 7. Write code -->
<line x1="81" y1="300" x2="222" y2="300" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="120" y="294">7. write code</text>

<!-- 8. Submit -->
<line x1="81" y1="335" x2="222" y2="335" stroke="#2563EB" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="120" y="329">8. submit_code(code)</text>

<line x1="234" y1="360" x2="375" y2="360" stroke="#7C3AED" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="270" y="354">9. evaluate(code, test_cases)</text>

<line x1="381" y1="390" x2="527" y2="390" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="420" y="384">10. run_tests(code)</text>

<line x1="527" y1="420" x2="387" y2="420" stroke="#059669" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="420" y="414">11. test results</text>

<!-- 12. Save attempt -->
<line x1="375" y1="450" x2="527" y2="450" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="400" y="444">12. save_attempt(score, status)</text>

<line x1="527" y1="475" x2="381" y2="475" stroke="#059669" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="400" y="469">13. saved</text>

<line x1="375" y1="500" x2="234" y2="500" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="260" y="494">14. score, feedback</text>

<!-- 15. Update progress -->
<line x1="228" y1="530" x2="527" y2="530" stroke="#059669" stroke-width="1.3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="310" y="524">15. update_progress(user_id)</text>

<line x1="222" y1="560" x2="82" y2="560" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text style="font:400 11px sans-serif;fill:#374151" x="100" y="554">16. show result screen</text>
</svg>